[package]
name = "tree-sitter-sprig"
description = "Sprig grammar for tree-sitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sprig", "tree-sitter", "grammar", "parser"]
categories = ["parser-implementations", "text-editors"]
authors.workspace = true
publish.workspace = true
build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "README.md"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.27"
sprig-core = { path = "../../crates/sprig-core" }
