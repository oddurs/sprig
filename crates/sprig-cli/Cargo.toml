[package]
name = "sprig-cli"
description = "The sprig command: check and query Sprig plans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "sprig"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
crossterm = "0.29"
jiff = "0.2"
# The file watcher the TUI reloads by: FSEvents, inotify or
# ReadDirectoryChangesW, which a plain-text plan edited elsewhere needs.
notify = "8"
ratatui = "0.30"
terminal_size = "0.4"
unicode-width = "0.2"
sprig-core = { path = "../sprig-core", version = "0.0.0" }
sprig-lsp = { path = "../sprig-lsp", version = "0.0.0" }
serde_json = "1"
similar = "3"

[dev-dependencies]
similar = "3"
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
jsonschema = { version = "0.33", default-features = false }
unicode-width = "0.2"
