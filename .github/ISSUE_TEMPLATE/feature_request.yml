name: Feature request
description: Something Sprig should do, or a change to the format
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Anything that becomes work becomes a [cairn item](https://github.com/oddurs/sprig/tree/main/cairn/items).
        Changes to the format are argued both ways first: read the settled
        arguments (`cairn list --view decisions`) before proposing one.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today. Not the feature, the situation that makes you want one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen. For a format change, show a before-and-after `.sprig` snippet.
    validations:
      required: false

  - type: textarea
    id: against
    attributes:
      label: The case against
      description: The strongest argument against your own proposal.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - spec: the format itself
        - cli: the sprig command
        - editors: grammars, language server, extensions
        - agents: MCP server and agent conventions
        - interop: import, export, calendars, CI
        - not sure
    validations:
      required: false
