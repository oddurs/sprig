version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # One pull request a week, not one per action.
      actions:
        update-types: [minor, patch]

  # Every committed lockfile is listed here; crates/sprig-cli/tests/docs.rs
  # fails when one is not, so a new one cannot go unwatched.
  - package-ecosystem: cargo
    directories: ["/", "/crates/sprig-core/fuzz"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: ["/site", "/editors", "/editors/vscode", "/tests/mcp"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      npm:
        update-types: [minor, patch]
