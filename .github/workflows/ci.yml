name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # All three, deliberately: 1.0 promises macOS, Linux and Windows, and the
    # places a plain-text parser breaks (CRLF, paths, file ordering) are exactly
    # the places those three differ.
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain named in rust-toolchain.toml on the first
      # cargo invocation, so there is nothing to pin twice.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `sprig graph | dot -Tsvg` and the shell guide's jq recipe are part of
      # the suite. Linux runs them for certain; elsewhere a test that lacks
      # the tool says it was skipped.
      - name: Install Graphviz
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q graphviz
      - run: ./scripts/task check
        env:
          SPRIG_CI_TOOLS: ${{ runner.os == 'Linux' && '1' || '' }}

  install:
    # The README's install line, on the three platforms v0.1 promises: a clean
    # install that runs. Once the crate is published this installs from
    # crates.io instead (cairn 0027).
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/task install

  backlog:
    # The plan is part of the repository, so a broken plan fails like broken
    # code. cairn is a pinned release binary, verified against its checksum.
    runs-on: ubuntu-latest
    env:
      CAIRN_VERSION: 1.0.0-alpha.1
    steps:
      - uses: actions/checkout@v7
      - name: Install cairn ${{ env.CAIRN_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          asset="cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "v${CAIRN_VERSION}" -R oddurs/cairn -p "$asset" -p SHA256SUMS -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          grep " ${asset}\$" SHA256SUMS | sha256sum -c -
          tar xzf "$asset"
          install -m 0755 "cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl/cairn" /usr/local/bin/cairn
          cairn --version
      - run: ./scripts/task backlog

  site:
    # The website builds from the spec, the backlog and the examples, so a
    # change to any of them can break it. The build checks the design tokens
    # and their contrast, every internal link, third-party requests, and runs
    # axe on every page in both themes; the runner's Chrome drives that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: ./scripts/task site

  editors:
    # The grammars and the VS Code extension. The extension test downloads VS
    # Code and runs it on examples/bakery/, so it needs a display.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The editor guide's Neovim section is followed in CI, on a clean config.
      - run: sudo apt-get update -q && sudo apt-get install -y -q neovim
      - run: xvfb-run -a ./scripts/task editors

  mcp:
    # sprig mcp, driven by the official MCP client as an agent's tools drive it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./scripts/task mcp

  fuzz:
    # A minute of each fuzz target on every change, seeded from the suite: a
    # regression in what the parser survives shows up here, and the long runs
    # before a release start from somewhere (cairn 0080).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/sprig-core/fuzz
      - run: FUZZ_SECONDS=60 ./scripts/task fuzz

  perf:
    # Release builds, on the runner the baseline was measured on: more than
    # twice the baseline fails, and so does a keystroke slower than 50 ms.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./scripts/task perf

  # The one status check branch protection requires. It exists so that adding a
  # job never means editing a protection rule.
  plans:
    # This repository's own action (action/), on its own example plans: the
    # pull request's summary shows what it did to them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./action
        with:
          paths: examples tests/import
          strict: true

  required:
    name: required
    if: always()
    needs: [check, install, backlog, site, editors, perf, plans, mcp, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}"
            exit 1
          fi
          if [ "${{ needs.install.result }}" != "success" ]; then
            echo "install: ${{ needs.install.result }}"
            exit 1
          fi
          if [ "${{ needs.backlog.result }}" != "success" ]; then
            echo "backlog: ${{ needs.backlog.result }}"
            exit 1
          fi
          if [ "${{ needs.site.result }}" != "success" ]; then
            echo "site: ${{ needs.site.result }}"
            exit 1
          fi
          if [ "${{ needs.editors.result }}" != "success" ]; then
            echo "editors: ${{ needs.editors.result }}"
            exit 1
          fi
          if [ "${{ needs.perf.result }}" != "success" ]; then
            echo "perf: ${{ needs.perf.result }}"
            exit 1
          fi
          if [ "${{ needs.plans.result }}" != "success" ]; then
            echo "plans: ${{ needs.plans.result }}"
            exit 1
          fi
          if [ "${{ needs.mcp.result }}" != "success" ]; then
            echo "mcp: ${{ needs.mcp.result }}"
            exit 1
          fi
          if [ "${{ needs.fuzz.result }}" != "success" ]; then
            echo "fuzz: ${{ needs.fuzz.result }}"
            exit 1
          fi
