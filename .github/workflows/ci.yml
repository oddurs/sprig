name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # All three, deliberately: 1.0 promises macOS, Linux and Windows, and the
    # places a plain-text parser breaks (CRLF, paths, file ordering) are exactly
    # the places those three differ.
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain named in rust-toolchain.toml on the first
      # cargo invocation, so there is nothing to pin twice.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./scripts/task check

  backlog:
    # The plan is part of the repository, so a broken plan fails like broken
    # code. cairn is a pinned release binary, verified against its checksum.
    runs-on: ubuntu-latest
    env:
      CAIRN_VERSION: 1.0.0-alpha.1
    steps:
      - uses: actions/checkout@v7
      - name: Install cairn ${{ env.CAIRN_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          asset="cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "v${CAIRN_VERSION}" -R oddurs/cairn -p "$asset" -p SHA256SUMS -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          grep " ${asset}\$" SHA256SUMS | sha256sum -c -
          tar xzf "$asset"
          install -m 0755 "cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl/cairn" /usr/local/bin/cairn
          cairn --version
      - run: ./scripts/task backlog

  # The one status check branch protection requires. It exists so that adding a
  # job never means editing a protection rule.
  required:
    name: required
    if: always()
    needs: [check, backlog]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}"
            exit 1
          fi
          if [ "${{ needs.backlog.result }}" != "success" ]; then
            echo "backlog: ${{ needs.backlog.result }}"
            exit 1
          fi
