[workspace]
resolver = "3"
members = ["crates/sprig-core", "crates/sprig-cli", "crates/sprig-lsp", "crates/sprig-wasm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/oddurs/sprig"
authors = ["Oddur Sigurdsson <oddurs@gmail.com>"]
# Nothing publishes until the name is cleared (cairn item 0006): a crate name,
# once taken on crates.io, cannot be given back.
publish = false

# The website's WebAssembly build: as small as it can be, since every visitor
# who touches the playground downloads it. `scripts/task wasm` uses it.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
